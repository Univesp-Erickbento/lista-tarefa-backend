# ============================================================================
# PERFIL PROD - Postgres de produção. Sem defaults, mesmo motivo do
# homolog - falha rápido no startup é melhor que rodar apontando pro
# banco errado.
# ============================================================================

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

  jpa:
    show-sql: false

logging:
  level:
    com.familia.listadetarefas: WARN
    org.hibernate.SQL: WARN
